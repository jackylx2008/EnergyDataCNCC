# 日志配置
log_level: INFO  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: ./logs/main_energy_cost.log  # 日志文件路径

# 输入/输出配置
paths:
  # input_file: D:/CloudStation/国会二期/02 能源工程师/2025年度北辰会投水电气热用量统计表/会展分公司/会展分公司统计水电气热月度基础数据（包括租户展商）.xlsx # 输入文件目录
  input_file: D:/CloudStation/国会二期/02 能源工程师/2026年度北辰会投水电气热用量统计表/会展分公司/会展分公司统计水电气热月度基础数据（总出口）.xlsx # 输入文件目录
  # input_file: D:/CloudStation/国会二期/02 能源工程师/2025年度北辰会投水电气热用量统计表/商管分公司/商管分公司统计水电气热月度基础数据（包括租户展商）.xlsx # 输入文件目录
  output_dir: ./output  # 输出文件目录

# 可视化配色配置
colors:
  energy:
    电: "#A8C8E1"
    采暖用热: "#C1E0A5"
    生活热水用热: "#F2B3B1"
    自来水: "#F28C28"
    中水: "#7E5AA7"
    燃气: "#B5754C"

# 标煤折算系数 (单位: kg标准煤 / 物理单位)
# 电: 0.1229 kg标准煤/kWh
# 燃气: 1.33 kg标准煤/m³ (按天然气低位发热量折算)
# 采暖热费: 34.12 kg标准煤/GJ
# 自来水/中水: 通常不计入标煤，或系数极小，此处设为 0
coal_conversion:
  电: 0.1229
  燃气: 1.33
  采暖用热: 34.10
  自来水: 0
  中水: 0
  生活热水用热: 34.10

# 经营收入 (单位: 万元)
operating_revenue:
  2025: 19428.42 # 主体2025年度经营收入
  # 2025: 27686 # B23 2025年度经营收入

# 总面积 (单位: 平方米)
total_area:
  主体: 418680.0 # 主体总面积
  # B23: 2117602.51 # B23总面积

# 年度对比配置
year_comparison:
  # 格式为 年份: 文件路径
  # 路径建议使用绝对路径
  files:
    2025: D:/CloudStation/国会二期/02 能源工程师/2025年度北辰会投水电气热用量统计表/会展分公司/会展分公司统计水电气热月度基础数据（包含租户展商）.xlsx # 示例路径，需替换为实际2024文件
    # 2026: D:/CloudStation/国会二期/02 能源工程师/2026年度北辰会投水电气热用量统计表/会展分公司/会展分公司统计水电气热月度基础数据（包含租户展商）.xlsx
  months:
    - 1


