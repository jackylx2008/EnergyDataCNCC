# 运行档位配置
runtime:
  profile: B25B26
  env_files:
    B25B26: common.b25b26.env
    B23: common.b23.env

# 环境相关值由对应 profile 的 .env 提供
log_level: ${LOG_LEVEL}
log_file: ${LOG_FILE}

paths:
  input_file: ${INPUT_FILE}
  output_dir: ${OUTPUT_DIR}

# 可视化配色配置
colors:
  energy:
    电: "#A8C8E1"
    采暖用热: "#C1E0A5"
    生活热水用热: "#F2B3B1"
    自来水: "#F28C28"
    中水: "#7E5AA7"
    燃气: "#B5754C"

# 标煤折算系数 (单位: kg标准煤 / 物理单位)
# 电: 0.1229 kg标准煤/kWh
# 燃气: 1.33 kg标准煤/m³ (按天然气低位发热量折算)
# 采暖热费: 34.12 kg标准煤/GJ
# 自来水/中水: 通常不计入标煤，或系数极小，此处设为 0
coal_conversion:
  电: 0.1229
  燃气: 1.33
  采暖用热: 34.10
  自来水: 0
  中水: 0
  生活热水用热: 34.10

# 经营收入、总面积、年度对比的值由对应 profile 的 .env 提供
operating_revenue:
  2025: ${OPERATING_REVENUE_2025}
  2026: ${OPERATING_REVENUE_2026}

total_area:
  B25B26: ${TOTAL_AREA_B25B26}

year_comparison:
  files:
    2025: ${YEAR_COMPARISON_FILE_2025}
  months:
    ${YEAR_COMPARISON_MONTHS}


